<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1712 700" width="1712" height="700">
  <rect width="1712" height="700" fill="white"/>

  <!-- Title -->
  <text x="856" y="52" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1a1a1a">Nonartikulasi: Mengapa Δ Neraca ≠ Penyesuaian SCF</text>
  <text x="856" y="90" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-style="italic" fill="#4d4d4d">(Metode Tidak Langsung — Masalah 3M)</text>

  <!-- Left column: three cause boxes -->
  <!-- Cause 1 -->
  <rect x="40" y="130" width="560" height="130" rx="6" ry="6" fill="white" stroke="#4d4d4d" stroke-width="2"/>
  <text x="320" y="175" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">Sebab 1</text>
  <text x="320" y="210" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">Akuisisi anak perusahaan</text>
  <text x="320" y="240" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">di tengah tahun fiskal</text>

  <!-- Cause 2 -->
  <rect x="40" y="285" width="560" height="130" rx="6" ry="6" fill="white" stroke="#4d4d4d" stroke-width="2"/>
  <text x="320" y="330" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">Sebab 2</text>
  <text x="320" y="365" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">Transaksi modal kerja nonkas</text>
  <text x="320" y="395" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">(write-up/down, reklasifikasi)</text>

  <!-- Cause 3 -->
  <rect x="40" y="440" width="560" height="130" rx="6" ry="6" fill="white" stroke="#4d4d4d" stroke-width="2"/>
  <text x="320" y="485" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">Sebab 3</text>
  <text x="320" y="520" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">Satu akun utang usaha untuk pos</text>
  <text x="320" y="550" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">modal kerja dan non-modal kerja</text>

  <!-- Arrows from each cause to center box -->
  <!-- Arrow 1: from cause 1 right edge to center box -->
  <line x1="600" y1="195" x2="700" y2="350" stroke="#4d4d4d" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <!-- Arrow 2: from cause 2 right edge to center box -->
  <line x1="600" y1="350" x2="700" y2="370" stroke="#4d4d4d" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <!-- Arrow 3: from cause 3 right edge to center box -->
  <line x1="600" y1="505" x2="700" y2="390" stroke="#4d4d4d" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4d4d4d"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Center box: NONARTIKULASI -->
  <rect x="706" y="270" width="380" height="210" rx="6" ry="6" fill="#1a1a1a"/>
  <text x="896" y="320" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="26" font-weight="bold" fill="white">NONARTIKULASI</text>
  <text x="896" y="360" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" fill="white">Δ akun neraca</text>
  <text x="896" y="395" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="28" font-weight="bold" fill="white">≠</text>
  <text x="896" y="430" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" fill="white">Penyesuaian SCF</text>
  <text x="896" y="462" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#d9d9d9">(metode tidak langsung)</text>

  <!-- Arrow from center to right box -->
  <line x1="1086" y1="375" x2="1166" y2="375" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrowhead2)"/>

  <!-- Right box: consequence -->
  <rect x="1172" y="240" width="500" height="270" rx="6" ry="6" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1422" y="290" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">Konsekuensi</text>
  <text x="1422" y="330" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">Angka SCF tidak dapat</text>
  <text x="1422" y="360" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">ditelusuri ke neraca.</text>
  <text x="1422" y="405" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">Terjadi pada ±75%</text>
  <text x="1422" y="435" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">perusahaan publik</text>
  <text x="1422" y="480" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="18" font-style="italic" fill="#4d4d4d">(Bahnson, Miller &amp; Budge)</text>

  <!-- Footer -->
  <text x="856" y="660" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="17" font-style="italic" fill="#4d4d4d">Sumber: Wolk, Dodd &amp; Tearney (2017), Ch. 13 — diolah penulis</text>
</svg>
