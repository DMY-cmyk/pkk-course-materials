<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1712 700" width="1712" height="700">
  <rect width="1712" height="700" fill="white"/>

  <!-- Title -->
  <text x="856" y="50" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1a1a1a">Jembatan CFO → FCF: ABC Company 2005</text>
  <text x="856" y="88" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-style="italic" fill="#4d4d4d">(dalam juta dolar AS — sumber: Wolk et al. 2017, Exhibit 13.10)</text>

  <!-- Y-axis label -->
  <text x="36" y="400" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#4d4d4d" transform="rotate(-90, 36, 400)">Juta Dolar AS</text>

  <!-- Grid lines at 0, 100, 200, 300, 400, 500 -->
  <!-- Scale: 0 = y 580, 600 = y 120; 1 unit = (580-120)/600 = 0.7667 px -->
  <!-- y(v) = 580 - v * 0.7667 -->
  <!-- 0 -> 580, 100 -> 503.3, 200 -> 426.7, 300 -> 350, 400 -> 273.3, 500 -> 196.7, 600 -> 120 -->
  <line x1="90" y1="580" x2="1660" y2="580" stroke="#d9d9d9" stroke-width="1"/>
  <text x="82" y="584" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#4d4d4d">0</text>
  <line x1="90" y1="503" x2="1660" y2="503" stroke="#d9d9d9" stroke-width="1"/>
  <text x="82" y="507" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#4d4d4d">100</text>
  <line x1="90" y1="427" x2="1660" y2="427" stroke="#d9d9d9" stroke-width="1"/>
  <text x="82" y="431" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#4d4d4d">200</text>
  <line x1="90" y1="350" x2="1660" y2="350" stroke="#d9d9d9" stroke-width="1"/>
  <text x="82" y="354" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#4d4d4d">300</text>
  <line x1="90" y1="273" x2="1660" y2="273" stroke="#d9d9d9" stroke-width="1"/>
  <text x="82" y="277" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#4d4d4d">400</text>
  <line x1="90" y1="197" x2="1660" y2="197" stroke="#d9d9d9" stroke-width="1"/>
  <text x="82" y="201" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#4d4d4d">500</text>

  <!-- Bars — width 220, gap 60, start x=115 -->
  <!-- Bar 1: CFO = 527. From 0 to 527. bottom=580, height=404 -->
  <!-- y_top = 580 - 527*0.7667 = 580 - 404.05 = 175.95 ~176 -->
  <rect x="115" y="176" width="220" height="404" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="225" y="160" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">$527</text>
  <text x="225" y="612" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">CFO</text>
  <!-- Connector line from top of bar 1 to bottom of bar 2 — cum=527, y=176 -->
  <line x1="335" y1="176" x2="395" y2="176" stroke="#8c8c8c" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Bar 2: +Bunga setelah pajak = +26. cum goes 527->553. bottom=176, top=176-20=156 -->
  <!-- h = 26*0.7667=19.93~20 -->
  <rect x="395" y="156" width="220" height="20" fill="#8c8c8c" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="505" y="140" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">+$26</text>
  <text x="505" y="638" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="19" fill="#1a1a1a">+ Bunga</text>
  <text x="505" y="658" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="19" fill="#1a1a1a">setelah pajak</text>
  <!-- Connector cum=553, y=156 -->
  <line x1="615" y1="156" x2="675" y2="156" stroke="#8c8c8c" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Bar 3: +Kenaikan kas operasi = +56. cum goes 553->609. bottom=156, top=156-43=113 -->
  <!-- h=56*0.7667=42.93~43 -->
  <rect x="675" y="113" width="220" height="43" fill="#8c8c8c" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="785" y="97" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">+$56</text>
  <text x="785" y="638" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="19" fill="#1a1a1a">− Kenaikan</text>
  <text x="785" y="658" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="19" fill="#1a1a1a">kas operasi</text>
  <!-- Connector cum=609, y=113 -->
  <line x1="895" y1="113" x2="955" y2="113" stroke="#8c8c8c" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Bar 4: CFI = -277. cum goes 609->332. Falling bar: bottom=580-332*0.7667=580-254.5=325.5~326, top=113 -->
  <!-- h=277*0.7667=212.37~212 -->
  <rect x="955" y="113" width="220" height="212" fill="#8c8c8c" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="1065" y="97" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">−$277</text>
  <text x="1065" y="638" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="19" fill="#1a1a1a">+ CFI</text>
  <text x="1065" y="658" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="19" fill="#4d4d4d">(negatif = investasi)</text>
  <!-- Connector from bottom of negative bar: cum=332, y=580-254=326 -->
  <line x1="1175" y1="325" x2="1235" y2="325" stroke="#8c8c8c" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Bar 5: FCF = 332. Full bar from 0. bottom=580, top=580-254.5=325.5~326 -->
  <rect x="1235" y="326" width="220" height="254" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="1345" y="310" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a">$332</text>
  <text x="1345" y="612" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">FCF</text>

  <!-- Formula text -->
  <text x="856" y="675" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#4d4d4d">FCF = CFO + Bunga Setelah Pajak − Kenaikan Kas Operasi + CFI = 527 + 26 + 56 − 277 = $332 juta</text>
</svg>
