<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1712 760" width="1712" height="760">
  <rect width="1712" height="760" fill="white"/>

  <!-- Title -->
  <text x="856" y="52" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1a1a1a">Empat Ukuran Kinerja Arus Kas: ABC Company 2005–2007</text>
  <text x="856" y="90" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-style="italic" fill="#4d4d4d">Sumber: Wolk, Dodd &amp; Rozycki (2017), Ch. 13</text>

  <!-- Y-axis label -->
  <text x="36" y="420" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#4d4d4d" transform="rotate(-90, 36, 420)">Juta Dolar AS</text>

  <!-- Y axis grid lines: 0,100,200,300,400,500,600 -->
  <!-- Scale: 0=y620, 600=y120. 1unit=(620-120)/600=0.8333 -->
  <!-- y(v) = 620 - v*0.8333 -->
  <line x1="100" y1="620" x2="1680" y2="620" stroke="#d9d9d9" stroke-width="1"/>
  <text x="92" y="624" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="17" fill="#4d4d4d">0</text>
  <line x1="100" y1="537" x2="1680" y2="537" stroke="#d9d9d9" stroke-width="1"/>
  <text x="92" y="541" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="17" fill="#4d4d4d">100</text>
  <line x1="100" y1="453" x2="1680" y2="453" stroke="#d9d9d9" stroke-width="1"/>
  <text x="92" y="457" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="17" fill="#4d4d4d">200</text>
  <line x1="100" y1="370" x2="1680" y2="370" stroke="#d9d9d9" stroke-width="1"/>
  <text x="92" y="374" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="17" fill="#4d4d4d">300</text>
  <line x1="100" y1="287" x2="1680" y2="287" stroke="#d9d9d9" stroke-width="1"/>
  <text x="92" y="291" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="17" fill="#4d4d4d">400</text>
  <line x1="100" y1="203" x2="1680" y2="203" stroke="#d9d9d9" stroke-width="1"/>
  <text x="92" y="207" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="17" fill="#4d4d4d">500</text>
  <line x1="100" y1="120" x2="1680" y2="120" stroke="#d9d9d9" stroke-width="1"/>
  <text x="92" y="124" text-anchor="end" font-family="Calibri, Arial, sans-serif" font-size="17" fill="#4d4d4d">600</text>

  <!-- Groups: 3 year groups. Group width = (1680-100)/3 = 526.67 each -->
  <!-- 4 bars per group, width=88, gap=10 within group, group starts at 100, 626.67, 1153.33 -->
  <!-- Colors: Laba bersih=#1a1a1a, CFO=#4d4d4d, CFO-CFI=#8c8c8c, FCF=#d9d9d9 (white fill, dark edge) -->

  <!-- Group 1: 2005 — start x=100 -->
  <!-- Laba bersih 320: h=320*0.8333=266.7 -> y=620-267=353 -->
  <rect x="120" y="353" width="88" height="267" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- CFO 527: h=527*0.8333=439.2 -> y=620-439=181 -->
  <rect x="220" y="181" width="88" height="439" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="1"/>
  <!-- CFO-CFI 250: h=250*0.8333=208.3 -> y=620-208=412 -->
  <rect x="320" y="412" width="88" height="208" fill="#8c8c8c" stroke="#1a1a1a" stroke-width="1"/>
  <!-- FCF 332: h=332*0.8333=276.7 -> y=620-277=343 -->
  <rect x="420" y="343" width="88" height="277" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="310" y="655" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">2005</text>

  <!-- Group 2: 2006 — start x=626 -->
  <!-- Laba bersih 312: h=312*0.8333=260 -> y=360 -->
  <rect x="650" y="360" width="88" height="260" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- CFO 466: h=466*0.8333=388.3 -> y=232 -->
  <rect x="750" y="232" width="88" height="388" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="1"/>
  <!-- CFO-CFI 157: h=157*0.8333=130.8 -> y=489 -->
  <rect x="850" y="489" width="88" height="131" fill="#8c8c8c" stroke="#1a1a1a" stroke-width="1"/>
  <!-- FCF 99: h=99*0.8333=82.5 -> y=538 -->
  <rect x="950" y="537" width="88" height="83" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="840" y="655" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">2006</text>

  <!-- Group 3: 2007 — start x=1152 -->
  <!-- Laba bersih 331: h=331*0.8333=275.8 -> y=344 -->
  <rect x="1176" y="344" width="88" height="276" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- CFO 434: h=434*0.8333=361.7 -> y=258 -->
  <rect x="1276" y="258" width="88" height="362" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="1"/>
  <!-- CFO-CFI 74: h=74*0.8333=61.7 -> y=558 -->
  <rect x="1376" y="558" width="88" height="62" fill="#8c8c8c" stroke="#1a1a1a" stroke-width="1"/>
  <!-- FCF 80: h=80*0.8333=66.7 -> y=553 -->
  <rect x="1476" y="553" width="88" height="67" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="1380" y="655" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">2007</text>

  <!-- Legend -->
  <rect x="110" y="685" width="26" height="26" fill="#1a1a1a"/>
  <text x="144" y="704" font-family="Calibri, Arial, sans-serif" font-size="19" fill="#1a1a1a">Laba Bersih</text>

  <rect x="310" y="685" width="26" height="26" fill="#4d4d4d"/>
  <text x="344" y="704" font-family="Calibri, Arial, sans-serif" font-size="19" fill="#1a1a1a">CFO (Arus Kas Operasi)</text>

  <rect x="640" y="685" width="26" height="26" fill="#8c8c8c"/>
  <text x="674" y="704" font-family="Calibri, Arial, sans-serif" font-size="19" fill="#1a1a1a">CFO − CFI</text>

  <rect x="870" y="685" width="26" height="26" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="904" y="704" font-family="Calibri, Arial, sans-serif" font-size="19" fill="#1a1a1a">FCF (Free Cash Flow)</text>

  <!-- Footnote -->
  <text x="856" y="740" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="17" font-style="italic" fill="#4d4d4d">Catatan: CFO − CFI = arus kas operasi dikurangi pengeluaran investasi (proxy sederhana FCF sebelum penyesuaian bunga)</text>
</svg>
