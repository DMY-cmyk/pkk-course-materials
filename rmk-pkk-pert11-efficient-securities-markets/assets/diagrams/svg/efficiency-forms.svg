<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1712 720" width="1712" height="720">
  <rect width="1712" height="720" fill="white"/>

  <!-- Title -->
  <text x="856" y="52" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1a1a1a">Tiga Bentuk Efisiensi Pasar (Fama, 1970)</text>
  <text x="856" y="92" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-style="italic" fill="#4d4d4d">Setiap bentuk yang lebih tinggi mencakup (subsumes) himpunan informasi bentuk di bawahnya</text>

  <!-- ── STRONG FORM — outermost box ── -->
  <rect x="60" y="118" width="1592" height="552" rx="10" ry="10" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Strong form label — top-left corner of the box -->
  <text x="100" y="162" font-family="Calibri, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">STRONG FORM</text>
  <text x="100" y="198" font-family="Calibri, Arial, sans-serif" font-size="22" fill="#1a1a1a">Harga mencerminkan SEMUA informasi — termasuk informasi privat / orang dalam (insider)</text>
  <text x="100" y="228" font-family="Calibri, Arial, sans-serif" font-size="20" font-style="italic" fill="#4d4d4d">Himpunan informasi: semua informasi yang ada (publik + privat)</text>
  <!-- Strong form right-side badge -->
  <rect x="1440" y="128" width="200" height="50" rx="6" ry="6" fill="#1a1a1a"/>
  <text x="1540" y="158" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="white">STRONG</text>

  <!-- ── SEMI-STRONG FORM — middle box ── -->
  <rect x="130" y="252" width="1452" height="368" rx="10" ry="10" fill="#d0d8e8" stroke="#4d4d4d" stroke-width="2.5"/>
  <!-- Semi-strong label -->
  <text x="172" y="296" font-family="Calibri, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">SEMI-STRONG FORM</text>
  <text x="172" y="332" font-family="Calibri, Arial, sans-serif" font-size="22" fill="#1a1a1a">Harga mencerminkan SEMUA informasi yang tersedia secara publik</text>
  <text x="172" y="360" font-family="Calibri, Arial, sans-serif" font-size="22" fill="#1a1a1a">(laporan keuangan, berita, pengumuman dividen, dll.)</text>
  <text x="172" y="392" font-family="Calibri, Arial, sans-serif" font-size="20" font-style="italic" fill="#4d4d4d">Himpunan informasi: semua informasi publik yang tersedia</text>
  <text x="172" y="420" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">★ Bentuk yang menjadi fokus utama Scott Ch. 4 — penelitian Fama (1970) menguji</text>
  <text x="172" y="448" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">   efisiensi pasar terhadap pengumuman publik (event studies).</text>
  <!-- Semi-strong badge -->
  <rect x="1372" y="262" width="198" height="50" rx="6" ry="6" fill="#4d4d4d"/>
  <text x="1471" y="292" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="19" font-weight="bold" fill="white">SEMI-STRONG</text>

  <!-- ── WEAK FORM — innermost box ── -->
  <rect x="200" y="476" width="1312" height="198" rx="10" ry="10" fill="#b8c8d8" stroke="#4d4d4d" stroke-width="2"/>
  <!-- Weak label -->
  <text x="244" y="520" font-family="Calibri, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">WEAK FORM</text>
  <text x="244" y="556" font-family="Calibri, Arial, sans-serif" font-size="22" fill="#1a1a1a">Harga mencerminkan semua informasi HARGA/RETURN HISTORIS</text>
  <text x="244" y="584" font-family="Calibri, Arial, sans-serif" font-size="20" font-style="italic" fill="#4d4d4d">Himpunan informasi: data harga &amp; volume perdagangan masa lalu</text>
  <text x="244" y="612" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#1a1a1a">Implikasi: analisis teknikal tidak menghasilkan abnormal return secara konsisten.</text>
  <!-- Weak badge -->
  <rect x="1370" y="486" width="130" height="50" rx="6" ry="6" fill="#8c8c8c"/>
  <text x="1435" y="516" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="22" font-weight="bold" fill="white">WEAK</text>

  <!-- Nesting arrow label at bottom -->
  <text x="856" y="698" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="19" font-style="italic" fill="#4d4d4d">Weak ⊂ Semi-Strong ⊂ Strong  (setiap kotak luar mencakup seluruh himpunan informasi kotak dalam)</text>
</svg>
